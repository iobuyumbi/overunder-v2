name: daily
on:
  schedule:
    - cron: "0 9 * * *"     # 09:00 UTC daily
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m overunder fetch-statarea
        continue-on-error: true
      - run: python -m overunder predict --statarea
        continue-on-error: true
      - run: python -m overunder settle
        continue-on-error: true
      - run: python -m overunder stats
      - uses: actions/upload-artifact@v4
        with:
          name: history
          path: data/
